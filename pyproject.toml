[project]
name = "pvz-agent-plugin"
version = "0.3.3"
description = "Windows desktop semantic AI agent and live dashboard for classic Plants vs. Zombies"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "loguru>=0.7",
  "httpx>=0.27,<1",
  "pywebview>=5.4,<7",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]

